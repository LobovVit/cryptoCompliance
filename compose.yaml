services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cryptocompliance
      POSTGRES_USER: cryptocompliance
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - crypto_compliance_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptocompliance -d cryptocompliance"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  crypto_compliance_pg:
